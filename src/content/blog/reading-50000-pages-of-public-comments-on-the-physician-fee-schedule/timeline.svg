ties</text><rect fill="#7fa3c7" height="11" rx="3" width="10.733333333333292" x="366.33333333333337" y="184"></rect><text class="small" x="0" y="212">Make dashboard scale to 43k comments</text><rect fill="#7fa3c7" height="11" rx="3" width="9.799999999999955" x="366.33333333333337" y="203"></rect><text class="small" x="0" y="231">Explore paraphrased campaign tagging</text><rect fill="#7fa3c7" height="11" rx="3" width="20.53333333333336" x="382.66666666666663" y="222"></rect><text class="small" x="0" y="250">Redesign dashboard Overview page</text><rect fill="#7fa3c7" height="11" rx="3" width="4.666666666666686" x="407.4" y="241"></rect><text class="small" x="0" y="269">Verify site build on published DBs</text><rect fill="#7fa3c7" height="11" rx="3" width="9.800000000000011" x="446.1333333333333" y="260"></rect><text class="small" x="0" y="288">Build per-docket dataset packs</text><rect fill="#7fa3c7" height="11" rx="3" width="29.866666666666674" x="466.66666666666663" y="279"></rect><text class="small" x="0" y="307">Implement scoped analysis backend</text><rect fill="#7fa3c7" height="11" rx="3" width="48.99999999999994" x="471.8" y="298"></rect><text class="small" x="0" y="326">Build scoped analysis sub-sites</text><rect fill="#7fa3c7" height="11" rx="3" width="7.466666666666697" x="517.0666666666666" y="317"></rect><text class="small" x="0" y="345">Blind compare 3.1 Pro vs 3.8 Flash</text><rect fill="#7fa3c7" height="11" rx="3" width="7.466666666666697" x="526.8666666666667" y="336"></rect><text class="small" x="0" y="364">Stratified entity discovery rebuild</text><rect fill="#7fa3c7" height="11" rx="3" width="228.20000000000005" x="536.6666666666666" y="355"></rect><text class="small" x="0" y="383">Profile and fix comment search perf</text><rect fill="#7fa3c7" height="11" rx="3" width="21" x="537.1333333333333" y="374"></rect><text class="small" x="0" y="402">Audit submitter metadata end to end</text><rect fill="#7fa3c7" height="11" rx="3" width="4.2000000000000455"