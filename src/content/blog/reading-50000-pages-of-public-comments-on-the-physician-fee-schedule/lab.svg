<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 892 360" width="892" height="360" role="img" aria-label="Experiments and what they decided"><style>
text{fill:#4b5753;font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}
.strong{fill:#1c2321;font-weight:700}
.big{fill:#1c2321;font-weight:700;font-size:20px}
