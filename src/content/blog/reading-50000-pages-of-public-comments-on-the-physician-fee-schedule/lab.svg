</style><rect width="100%" height="100%" rx="10" fill="#ffffff" stroke="#dfe3de"/><g transform="translate(16,16)"><text class="strong" x="0" y="19">Entity discovery redesign</text><text class="small" x="0" y="37">Read the whole docket, stratified by theme</text><rect fill="#8a5a9e" height="18" rx="3" width="360" x="300" y="8"></rect><text x="668" y="22">$16.5</text><text class="strong" x="0" y="65">1-in-20 rehearsal of the full pipeline</text><text class="small" x="0" y="83">Every step worked end to end before the real run</text><rect fill="#8a5a9e" height="18" rx="3" width="327.27272727272725" x="300" y="54"></rect><text x="635.2727272727273" y="68">$15</text><text class="strong" x="0" y="111">Gemini 3.1 Pro vs 3.8 Flash, blind</text><text class="small" x="0" y="129">Keep 3.8 Flash for reports (won 8 to 3)</text><rect fill="#8a5a9e" height="18" rx="3" width="139.63636363636363" x="300" y="100"></rect><text x="447.6363636363636" y="114">$6.4</text><text class="strong" x="0" y="157">Scoped analysis tests</text><text class="small" x="0" y="175">Relevance on 3.8 Flash; ~$17 per scope at PFS scale</text><rect fill="#8a5a9e" height="18" rx="3" width="113.45454545454547" x="300" y="146"></rect><text x="421.4545454545455" y="160">$5.2</text><text class="strong" x="0" y="203">Theme extraction trials</text><text class="small" x="0" y="221">Gate short letters; one call per long letter</text><rect fill="#8a5a9e" height="18" rx="3" width="100.36363636363635" x="300" y="192"></rect><text x="408.3636363636364" y="206">$4.6</text><text class="strong" x="0" y="249">Condense and triage trials</text><text class="small" x="0" y="267">Flash-Lite for short comment-box text, 3.8 Flash for long letters</text><rect fill="#8a5a9e" height="18" rx="3" width="45.81818181818182" x="300" y="238"></rect><text x="353.8181818181818" y="252">$2.1</text><text class="strong" x="0" y="295">How distinct are the leftovers?</text><text class="small" x="0" y="313">Embeddings showed what copy-matching can't collapse</text><rect fill="#8a5a9e" height="18" rx="3" width="26.18181818181818" x="300" y="284"></rect><text x="334.1818181818182" y="298">$1.2</text></g></svg>
