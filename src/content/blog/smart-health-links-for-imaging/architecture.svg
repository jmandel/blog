<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">Architecture and trust</title>
<desc id="arch-desc">Three parties. The sharer's browser takes imaging from files or a CD, from a SMART Health Link someone gave them, or from a provider through SMART Imaging Access, encrypts each study as one file under its own random key, and uploads only ciphertext to the host. The host stores bundle.jwe and one encrypted .bin file per study under random names and sees only those names, their sizes and the byte ranges requested; it never sees a patient name, a DICOM UID or a key. The link, with its key after the # in the URL, goes from sharer to recipient by QR code or message and never passes through the host. The recipient's browser fetches bundle.jwe and then byte ranges from the host, checks each record's tag, decrypts and decodes. Plaintext exists only in the two browsers.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#2b2f36;font-size:15px}
.h{font-size:19px;font-weight:700}
.b{font-weight:600}
.m{fill:#5f6670;font-size:14px}
.s{fill:#5f6670;font-size:13px}
.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;font-size:12.5px}
.pu{fill:#6b3f9a}.gr{fill:#3f8a2e}.bl{fill:#1f6fb2}.or{fill:#b85f0c}
</style>
<defs>
<marker id="a-bl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2f86cf"/></marker>
<marker id="a-or" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#e07f22"/></marker>
<marker id="a-pu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#7b4fa8"/></marker>
<marker id="a-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4f9d3a"/></marker>
<g id="key"><circle cx="0" cy="0" r="5.5" fill="none" stroke="#e07f22" stroke-width="2.2"/><path d="M5.5,0H18M13,0V5M17,0V4" fill="none" stroke="#e07f22" stroke-width="2.2" stroke-linecap="round"/></g>
</defs>
<rect width="1000" height="550" fill="#ffffff"/>

<!-- Sharer -->
<rect x="20" y="20" width="260" height="400" rx="12" fill="#7b4fa8" fill-opacity="0.06" stroke="#7b4fa8" stroke-width="1.3"/>
<text x="40" y="52" class="h pu">Sharer's browser</text>
<text x="40" y="82" class="m">Imaging from</text>
<rect x="40" y="92" width="220" height="34" rx="7" fill="#fff" stroke="#c9b6dd"/>
<text x="54" y="114">Files or a CD</text>
<rect x="40" y="134" width="220" height="34" rx="7" fill="#fff" stroke="#c9b6dd"/>
<text x="54" y="156">A link someone gave you</text>
<rect x="40" y="176" width="220" height="50" rx="7" fill="#fff" stroke="#c9b6dd"/>
<text x="54" y="197">A provider, via</text>
<text x="54" y="216">SMART Imaging Access</text>
<line x1="150" y1="230" x2="150" y2="258" stroke="#7b4fa8" stroke-width="1.5" marker-end="url(#a-pu)"/>
<rect x="40" y="262" width="220" height="58" rx="7" fill="#7b4fa8" fill-opacity="0.12" stroke="#7b4fa8"/>
<text x="54" y="286" class="b">Encrypts on the device</text>
<text x="54" y="307" class="m">one file and key per study</text>
<line x1="40" y1="344" x2="260" y2="344" stroke="#d9cfe6"/>
<text x="40" y="372" class="b pu">Sees the study</text>
<text x="40" y="394" class="m">plaintext stays in the browser</text>

<!-- Host -->
<rect x="370" y="20" width="260" height="400" rx="12" fill="#2b2f36" fill-opacity="0.04" stroke="#5f6670" stroke-width="1.3"/>
<text x="390" y="52" class="h">Host</text>
<text x="390" y="82" class="m">Stores ciphertext only</text>
<rect x="390" y="92" width="220" height="228" rx="7" fill="#fff" stroke="#c4c9cf"/>
<text x="404" y="117" class="mono">bundle.jwe</text>
<line x1="404" y1="130" x2="596" y2="130" stroke="#e3e6ea"/>
<text x="404" y="153" class="mono">gszT7dag7ShL7r8INu338w.bin</text>
<text x="404" y="177" class="mono">7VlPEPjJUkCLNgY3u4iKag.bin</text>
<text x="404" y="201" class="mono">YIBWCEoh3L4ybdljFjEzhg.bin</text>
<text x="404" y="225" class="mono">eq1bF7KR0w5Ij4iy4hrPhA.bin</text>
<text x="404" y="249" class="mono">lLjT6NYH1HJ-Er39X9RUZA.bin</text>
<text x="404" y="273" class="mono">hCy2gXn3-fYIivjOSJWytw.bin</text>
<text x="404" y="302" class="s">one encrypted file per study</text>
<line x1="390" y1="344" x2="610" y2="344" stroke="#d6dade"/>
<text x="390" y="366" class="b">Sees random file names,</text>
<text x="390" y="386" class="b">sizes and byte ranges</text>
<text x="390" y="406" class="m">No names, DICOM UIDs or keys</text>

<!-- Recipient -->
<rect x="720" y="20" width="260" height="400" rx="12" fill="#4f9d3a" fill-opacity="0.06" stroke="#4f9d3a" stroke-width="1.3"/>
<text x="740" y="52" class="h gr">Recipient's browser</text>
<text x="740" y="82" class="m">Opens the link</text>
<rect x="740" y="92" width="220" height="62" rx="7" fill="#fff" stroke="#bcd9b2"/>
<text x="754" y="116" class="mono" style="font-size:13.5px">/view#shlink:/eyJ1…</text>
<use href="#key" x="761" y="137"/>
<text x="788" y="142" class="s">key after the #, not sent</text>
<line x1="850" y1="158" x2="850" y2="186" stroke="#4f9d3a" stroke-width="1.5" marker-end="url(#a-gr)"/>
<rect x="740" y="190" width="220" height="40" rx="7" fill="#fff" stroke="#bcd9b2"/>
<text x="754" y="215">Fetches only what it needs</text>
<line x1="850" y1="234" x2="850" y2="258" stroke="#4f9d3a" stroke-width="1.5" marker-end="url(#a-gr)"/>
<rect x="740" y="262" width="220" height="58" rx="7" fill="#4f9d3a" fill-opacity="0.12" stroke="#4f9d3a"/>
<text x="754" y="286" class="b">Checks, decrypts, decodes</text>
<text x="754" y="307" class="m">each record's tag first</text>
<line x1="740" y1="344" x2="960" y2="344" stroke="#cfe3c8"/>
<text x="740" y="372" class="b gr">Sees the study</text>
<text x="740" y="394" class="m">plaintext stays in the browser</text>

<!-- upload -->
<line x1="262" y1="291" x2="386" y2="291" stroke="#2f86cf" stroke-width="2.2" marker-end="url(#a-bl)"/>
<text x="325" y="262" class="b bl" text-anchor="middle">upload</text>
<text x="325" y="279" class="s" text-anchor="middle">ciphertext</text>

<!-- fetch -->
<line x1="612" y1="210" x2="736" y2="210" stroke="#2f86cf" stroke-width="2.2" marker-end="url(#a-bl)"/>
<text x="675" y="164" class="b bl" text-anchor="middle">GET</text>
<text x="675" y="181" class="s" text-anchor="middle">bundle.jwe,</text>
<text x="675" y="198" class="s" text-anchor="middle">Range → 206</text>

<!-- link out of band -->
<path d="M150,424 V468 Q150,494 176,494 H824 Q850,494 850,468 V428" fill="none" stroke="#e07f22" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a-or)"/>
<rect x="270" y="478" width="460" height="32" rx="16" fill="#fff"/>
<use href="#key" x="292" y="494"/>
<text x="320" y="500" class="b or">Link with its key, by QR code or message</text>
<text x="500" y="532" class="s" text-anchor="middle">The host never receives the key.</text>
</svg>
