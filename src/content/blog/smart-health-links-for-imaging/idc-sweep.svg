<rect x="435" y="387.6" width="12" height="12" rx="2" fill="#2f86cf"/>
<rect x="450" y="387.6" width="12" height="12" rx="2" fill="#2f86cf"/>
<rect x="465" y="387.6" width="12" height="12" rx="2" fill="#2f86cf"/>
<text x="494" y="398.6"><tspan class="b">8</tspan>  Missing Planar Configuration</text>
<text x="494" y="416.6" class="s">RGB files from Philips and GE; now inferred</text>
<rect x="360" y="429.6" width="12" height="12" rx="2" fill="#e07f22"/>
<rect x="375" y="429.6" width="12" height="12" rx="2" fill="#e07f22"/>
<rect x="390" y="429.6" width="12" height="12" rx="2" fill="#e07f22"/>
<rect x="405" y="429.6" width="12" height="12" rx="2" fill="#e07f22"/>
<text x="494" y="440.6"><tspan class="b">4</tspan>  Leica JPEG 2000, off by up to 3</text>
<text x="494" y="458.6" class="s">ruled within tolerance</text>
<rect x="360" y="471.6" width="12" height="12" rx="2" fill="#7b4fa8"/>
<rect x="375" y="471.6" width="12" height="12" rx="2" fill="#7b4fa8"/>
<rect x="390" y="471.6" width="12" height="12" rx="2" fill="#7b4fa8"/>
<text x="494" y="482.6"><tspan class="b">3</tspan>  Float parametric maps</text>
<text x="494" y="500.6" class="s">since implemented</text>
<text x="20" y="524" class="s">Source: codec-corpus/prevalence/LONGTAIL.md, 15 Oct 2026. Files from the NCI Imaging Data Commons.</text>
