<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="sw-title sw-desc">
<title id="sw-title">The IDC sweep</title>
<desc id="sw-desc">Left: the random control of 1,000 files from the NCI Imaging Data Commons, 1,000 of 1,000 matching the reference decoders, with a 95% interval of 99.62% to 100%. Right: the 9,537 long-tail files that could be evaluated, one square each; 9,522 passed and 15 did not. Of the 15, 8 were RGB files missing Planar Configuration, now inferred from pixel smoothness; 4 were Leica JPEG 2000 slides with differences of up to 3, ruled within tolerance; and 3 were float parametric maps, since implemented.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#2b2f36;font-size:15px}
.h{font-size:18px;font-weight:700}
.big{font-size:34px;font-weight:700}
.b{font-weight:600}
.m{fill:#5f6670;font-size:14px}
.s{fill:#5f6670;font-size:13px}
</style>
<defs><pattern id="sw-cell" width="3.9" height="3.9" patternUnits="userSpaceOnUse"><rect width="3.1" height="3.1" fill="#cfd5cc"/></pattern></defs>
<rect width="1000" height="540" fill="#ffffff"/>
<text x="20" y="40" class="h">Random control</text>
<text x="20" y="62" class="m">1,000 files chosen at random</text>
<text x="20" y="118" class="big">1,000 / 1,000</text>
<text x="20" y="142" class="m">matched the reference decoders</text>
<line x1="30" y1="230" x2="290" y2="230" stroke="#c4c9cf"/>
<line x1="30.0" y1="230" x2="30.0" y2="235" stroke="#c4c9cf"/>
<text x="30.0" y="252" class="s" text-anchor="middle">99.0%</text>
<line x1="160.0" y1="230" x2="160.0" y2="235" stroke="#c4c9cf"/>
<text x="160.0" y="252" class="s" text-anchor="middle">99.5%</text>
<line x1="290.0" y1="230" x2="290.0" y2="235" stroke="#c4c9cf"/>
<text x="290.0" y="252" class="s" text-anchor="middle">100%</text>
<line x1="191.2" y1="204" x2="290.0" y2="204" stroke="#4f9d3a" stroke-width="2"/>
<line x1="191.2" y1="196" x2="191.2" y2="212" stroke="#4f9d3a" stroke-width="2"/>
<circle cx="290.0" cy="204" r="5.5" fill="#4f9d3a"/>
<text x="191.2" y="188" class="s" text-anchor="middle">99.62%</text>
<text x="30" y="280" class="m">pass rate, with its 95% interval</text>
<line x1="330" y1="24" x2="330" y2="490" stroke="#e3e6ea"/>
<text x="360" y="40" class="h">Hard cases, picked for rarity</text>
<text x="360" y="62" class="m">9,537 evaluated files, one square each: 9,522 passed</text>
<rect x="360" y="80" width="585.0" height="245.7" fill="url(#sw-cell)"/>
<rect x="360" y="325.7" width="280.8" height="3.9" fill="url(#sw-cell)"/>
<rect x="640.8" y="325.7" width="3.1" height="3.1" fill="#2f86cf"/>
<rect x="644.7" y="325.7" width="3.1" height="3.1" fill="#2f86cf"/>
<rect x="648.6" y="325.7" width="3.1" height="3.1" fill="#2f86cf"/>
<rect x="652.5" y="325.7" width="3.1" height="3.1" fill="#2f86cf"/>
<rect x="656.4" y="325.7" width="3.1" height="3.1" fill="#2f86cf"/>
<rect x="660.3" y="325.7" width="3.1" height="3.1" fill="#2f86cf"/>
<rect x="664.2" y="325.7" width="3.1" height="3.1" fill="#2f86cf"/>
<rect x="668.1" y="325.7" width="3.1" height="3.1" fill="#2f86cf"/>
<rect x="672.0" y="325.7" width="3.1" height="3.1" fill="#e07f22"/>
<rect x="675.9" y="325.7" width="3.1" height="3.1" fill="#e07f22"/>
<rect x="679.8" y="325.7" width="3.1" height="3.1" fill="#e07f22"/>
<rect x="683.7" y="325.7" width="3.1" height="3.1" fill="#e07f22"/>
<rect x="687.6" y="325.7" width="3.1" height="3.1" fill="#7b4fa8"/>
<rect x="691.5" y="325.7" width="3.1" height="3.1" fill="#7b4fa8"/>
<rect x="695.4" y="325.7" width="3.1" height="3.1" fill="#7b4fa8"/>
<rect x="638.8" y="323.7" width="61.7" height="7.1" fill="none" stroke="#2b2f36" stroke-width="1"/>
<line x1="669.6" y1="331.7" x2="669.6" y2="355.6" stroke="#2b2f36" stroke-width="1"/>
<text x="360" y="369.6" class="b">The 15 that didn’t pass</text>
<rect x="360" y="387.6" width="12" height="12" rx="2" fill="#2f86cf"/>
<rect x="375" y="387.6" width="12" height="12" rx="2" fill="#2f86cf"/>
<rect x="390" y="387.6" width="12" height="12" rx="2" fill="#2f86cf"/>
