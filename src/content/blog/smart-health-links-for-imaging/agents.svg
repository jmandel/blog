<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="ag-title ag-desc">
<title id="ag-title">Who did what</title>
<desc id="ag-desc">Josh works with one coordinator, a Claude Code session that owns the shared files, runs the verification suites and makes the commits. The coordinator dispatches Claude subagents that work in parallel, each owning a directory: codecs (one agent per codec), the test corpus and IDC sweep, the viewer, sharing, whole-slide images, video, the imaging sandbox, the How it works page, and de-identification of the sample data. It also directs a pi session running Gemini in a tmux pane, which built the first server and web page, and Codex, which drew the illustrations.</desc>
