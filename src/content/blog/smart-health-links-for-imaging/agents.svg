.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;font-size:12.5px;fill:#5f6670}
.pu{fill:#6b3f9a}.gr{fill:#3f8a2e}.bl{fill:#1f6fb2}.or{fill:#b85f0c}
</style>
