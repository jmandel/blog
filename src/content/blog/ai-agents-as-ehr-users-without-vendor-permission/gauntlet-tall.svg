<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 2043" width="456" height="2043" role="img" aria-label="Flow of a fictional request to let an agent operate an EHR: twelve steps over 96 business days, with three loops, ending in a complaint">
<style>
text{font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.title{font-size:17px;font-weight:700;fill:#1c2321}
.sub{font-size:12.5px;fill:#5a6662}
.who{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.day{font-size:13px;font-weight:700}
.body{font-size:14.5px}
.cfr{font-size:11.5px;font-family:ui-monospace,"SFMono-Regular",Menlo,monospace}
.lab{font-size:11.5px;font-weight:600}
.loop{font-size:11.5px;font-weight:700}
.leg{font-size:11.5px;fill:#1c2321}
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="14" y="26" class="title">96 business days to "no"</text>
<text x="14" y="46" class="sub">Fictional request. Every step is one the current rules allow.</text>
<rect x="14" y="64" width="356" height="98" rx="14" fill="#ffffff" stroke="#1c2321" stroke-width="2"/>
<text x="26" y="88" class="who" fill="#1c2321">Clinic</text>
<text x="358" y="88" class="day" text-anchor="end" fill="#1c2321">Day 0</text>
<text x="26" y="110" class="body" fill="#1c2321">The clinic asks its EHR vendor to confirm</text>
<text x="26" y="129" class="body" fill="#1c2321">clinicians may use an agent.</text>
<text x="26" y="154" class="cfr" fill="#5a6662">Customer license agreement</text>
<line x1="70" y1="162" x2="70" y2="213" stroke="#1c2321" stroke-width="1.6"/>
<path d="M65,212 L70,220 L75,212 Z" fill="#1c2321"/>
<rect x="84" y="179.0" width="185.0" height="24" rx="12" fill="#ffffff" stroke="#5a6662" stroke-dasharray="4 3"/>
<text x="94" y="195.5" class="lab" fill="#1c2321">8 business days · no clock</text>
<rect x="14" y="220" width="356" height="117" rx="2" fill="#eceeeb" stroke="#8b9490" stroke-width="1.2"/>
<text x="26" y="244" class="who" fill="#1c2321">Vendor</text>
<text x="358" y="244" class="day" text-anchor="end" fill="#1c2321">Day 8</text>
<text x="26" y="266" class="body" fill="#1c2321">License §4.2 bars automated use and</text>
<text x="26" y="285" class="body" fill="#1c2321">third-party access. The developer is sent to</text>
<text x="26" y="304" class="body" fill="#1c2321">Partner Programs.</text>
<text x="26" y="329" class="cfr" fill="#5a6662">Contract term; no clock</text>
<line x1="70" y1="337" x2="70" y2="388" stroke="#1c2321" stroke-width="1.6"/>
<path d="M65,387 L70,395 L75,387 Z" fill="#1c2321"/>
<rect x="84" y="354.0" width="48.5" height="24" rx="12" fill="#ffffff" stroke="#5a6662" stroke-dasharray="4 3"/>
<text x="94" y="370.5" class="lab" fill="#1c2321">1 day</text>
<rect x="14" y="395" width="356" height="117" rx="14" fill="#ffffff" stroke="#1c2321" stroke-width="2"/>
<text x="26" y="419" class="who" fill="#1c2321">Developer</text>
<text x="358" y="419" class="day" text-anchor="end" fill="#1c2321">Day 9</text>
<text x="26" y="441" class="body" fill="#1c2321">Requests the manner it wants: operate the</text>
<text x="26" y="460" class="body" fill="#1c2321">screens, message history included, under an</text>
<text x="26" y="479" class="body" fill="#1c2321">account the clinic authorizes.</text>
<text x="26" y="504" class="cfr" fill="#5a6662">§171.301(a)(1)</text>
<line x1="70" y1="512" x2="70" y2="563" stroke="#1c2321" stroke-width="1.6"/>
<path d="M65,562 L70,570 L75,562 Z" fill="#1c2321"/>
<rect x="84" y="529.0" width="133.0" height="24" rx="12" fill="#ffffff" stroke="#5a6662" stroke-dasharray="4 3"/>
<text x="94" y="545.5" class="lab" fill="#1c2321">25 days · no clock</text>
<rect x="14" y="570" width="356" height="117" rx="2" fill="#eceeeb" stroke="#8b9490" stroke-width="1.2"/>
<text x="26" y="594" class="who" fill="#1c2321">Vendor</text>
<text x="358" y="594" class="day" text-anchor="end" fill="#1c2321">Day 34</text>
<text x="26" y="616" class="body" fill="#1c2321">Names its price. The cost-based,</text>
<text x="26" y="635" class="body" fill="#1c2321">nondiscriminatory fee rules skip the manner</text>
<text x="26" y="654" class="body" fill="#1c2321">requested. No agreed terms.</text>
<text x="26" y="679" class="cfr" fill="#5a6662">§171.301(a)(2)</text>
<line x1="70" y1="687" x2="70" y2="738" stroke="#1c2321" stroke-width="1.6"/>
<path d="M65,737 L70,745 L75,737 Z" fill="#1c2321"/>
<rect x="84" y="704.0" width="250.0" height="24" rx="12" fill="#ffffff" stroke="#5a6662" stroke-dasharray="4 3"/>
<text x="94" y="720.5" class="lab" fill="#1c2321">5 days · &quot;without unnecessary delay&quot;</text>
<rect x="14" y="745" width="356" height="98" rx="2" fill="#eceeeb" stroke="#8b9490" stroke-width="1.2"/>
<text x="26" y="769" class="who" fill="#1c2321">Vendor</text>
<text x="358" y="769" class="day" text-anchor="end" fill="#1c2321">Day 39</text>
<text x="26" y="791" class="body" fill="#1c2321">Offers an alternative manner instead: the</text>
<text x="26" y="810" class="body" fill="#1c2321">certified FHIR API, which covers USCDI data.</text>
<text x="26" y="835" class="cfr" fill="#5a6662">§171.301(b)(1)(i)</text>
<line x1="70" y1="843" x2="70" y2="894" stroke="#1c2321" stroke-width="1.6"/>
<path d="M65,893 L70,901 L75,893 Z" fill="#1c2321"/>
<rect x="84" y="860.0" width="217.5" height="24" rx="12" fill="#1c2321"/>
<text x="94" y="876.5" class="lab" fill="#ffffff">15 business days · registration</text>
<rect x="14" y="901" width="356" height="98" rx="2" fill="#eceeeb" stroke="#8b9490" stroke-width="1.2"/>
<text x="26" y="925" class="who" fill="#1c2321">Vendor</text>
<text x="358" y="925" class="day" text-anchor="end" fill="#1c2321">Day 54</text>
<text x="26" y="947" class="body" fill="#1c2321">Registers the app on the last permitted day:</text>
<text x="26" y="966" class="body" fill="#1c2321">10 business days to verify, 5 to enable.</text>
<text x="26" y="991" class="cfr" fill="#5a6662">§170.404(b)(1)</text>
<line x1="70" y1="999" x2="70" y2="1050" stroke="#1c2321" stroke-width="1.6"/>
<path d="M65,1049 L70,1057 L75,1049 Z" fill="#1c2321"/>
<rect x="84" y="1016.0" width="126.5" height="24" rx="12" fill="#ffffff" stroke="#5a6662" stroke-dasharray="4 3"/>
<text x="94" y="1032.5" class="lab" fill="#1c2321">6 days of testing</text>
<rect x="14" y="1057" width="356" height="117" rx="14" fill="#ffffff" stroke="#1c2321" stroke-width="2"/>
<text x="26" y="1081" class="who" fill="#1c2321">Developer</text>
<text x="358" y="1081" class="day" text-anchor="end" fill="#1c2321">Day 60</text>
<text x="26" y="1103" class="body" fill="#1c2321">Message history and the screening schedule</text>
<text x="26" y="1122" class="body" fill="#1c2321">are not in USCDI, so not in the API. Asks for</text>
<text x="26" y="1141" class="body" fill="#1c2321">them, plus drafting.</text>
<text x="26" y="1166" class="cfr" fill="#5a6662">§171.102 &quot;use&quot;</text>
<line x1="70" y1="1174" x2="70" y2="1225" stroke="#1c2321" stroke-width="1.6"/>
<path d="M65,1224 L70,1232 L75,1224 Z" fill="#1c2321"/>
<rect x="84" y="1191.0" width="243.5" height="24" rx="12" fill="#1c2321"/>
<text x="94" y="1207.5" class="lab" fill="#ffffff">10 business days · written response</text>
<rect x="14" y="1232" width="356" height="117" rx="2" fill="#eceeeb" stroke="#8b9490" stroke-width="1.2"/>
<text x="26" y="1256" class="who" fill="#1c2321">Vendor</text>
<text x="358" y="1256" class="day" text-anchor="end" fill="#1c2321">Day 70</text>
<text x="26" y="1278" class="body" fill="#1c2321">Drafts denied in writing: a third party</text>
<text x="26" y="1297" class="body" fill="#1c2321">seeking to modify EHI. Messages offered as a</text>
<text x="26" y="1316" class="body" fill="#1c2321">nightly file.</text>
<text x="26" y="1341" class="cfr" fill="#5a6662">§171.204(a)(3); §171.301(b)</text>
<line x1="70" y1="1349" x2="70" y2="1400" stroke="#1c2321" stroke-width="1.6"/>
<path d="M65,1399 L70,1407 L75,1399 Z" fill="#1c2321"/>
<rect x="84" y="1366.0" width="48.5" height="24" rx="12" fill="#ffffff" stroke="#5a6662" stroke-dasharray="4 3"/>
<text x="94" y="1382.5" class="lab" fill="#1c2321">1 day</text>
<rect x="14" y="1407" width="356" height="98" rx="14" fill="#ffffff" stroke="#1c2321" stroke-width="2"/>
<text x="26" y="1431" class="who" fill="#1c2321">Clinic</text>
<text x="358" y="1431" class="day" text-anchor="end" fill="#1c2321">Day 71</text>
<text x="26" y="1453" class="body" fill="#1c2321">Makes the same request itself, as the</text>
<text x="26" y="1472" class="body" fill="#1c2321">vendor&#x27;s customer.</text>
<text x="26" y="1497" class="cfr" fill="#5a6662">§171.301(a)(1)</text>
<line x1="70" y1="1505" x2="70" y2="1556" stroke="#1c2321" stroke-width="1.6"/>
<path d="M65,1555 L70,1563 L75,1555 Z" fill="#1c2321"/>
<rect x="84" y="1522.0" width="133.0" height="24" rx="12" fill="#ffffff" stroke="#5a6662" stroke-dasharray="4 3"/>
<text x="94" y="1538.5" class="lab" fill="#1c2321">14 days · no clock</text>
<rect x="14" y="1563" width="356" height="98" rx="2" fill="#eceeeb" stroke="#8b9490" stroke-width="1.2"/>
<text x="26" y="1587" class="who" fill="#1c2321">Vendor</text>
<text x="358" y="1587" class="day" text-anchor="end" fill="#1c2321">Day 85</text>
<text x="26" y="1609" class="body" fill="#1c2321">Quotes an add-on. No agreeable terms. Two</text>
<text x="26" y="1628" class="body" fill="#1c2321">alternatives are already on the table.</text>
<text x="26" y="1653" class="cfr" fill="#5a6662">§171.301(a), (b)</text>
<line x1="70" y1="1661" x2="70" y2="1712" stroke="#1c2321" stroke-width="1.6"/>
<path d="M65,1711 L70,1719 L75,1711 Z" fill="#1c2321"/>
<rect x="84" y="1678.0" width="243.5" height="24" rx="12" fill="#1c2321"/>
<text x="94" y="1694.5" class="lab" fill="#ffffff">10 business days · written response</text>
<rect x="14" y="1719" width="356" height="98" rx="2" fill="#eceeeb" stroke="#8b9490" stroke-width="1.2"/>
<text x="26" y="1743" class="who" fill="#1c2321">Vendor</text>
<text x="358" y="1743" class="day" text-anchor="end" fill="#1c2321">Day 95</text>
<text x="26" y="1765" class="body" fill="#1c2321">Letter: infeasible, manner exception</text>
<text x="26" y="1784" class="body" fill="#1c2321">exhausted.</text>
<text x="26" y="1809" class="cfr" fill="#5a6662">§171.204(a)(4), (b)</text>
<line x1="70" y1="1817" x2="70" y2="1868" stroke="#1c2321" stroke-width="1.6"/>
<path d="M65,1867 L70,1875 L75,1867 Z" fill="#1c2321"/>
<rect x="84" y="1834.0" width="48.5" height="24" rx="12" fill="#ffffff" stroke="#5a6662" stroke-dasharray="4 3"/>
<text x="94" y="1850.5" class="lab" fill="#1c2321">1 day</text>
<rect x="14" y="1875" width="356" height="98" rx="14" fill="#1c2321" stroke="#1c2321" stroke-width="2"/>
<text x="26" y="1899" class="who" fill="#ffffff">Clinic and developer</text>
<text x="358" y="1899" class="day" text-anchor="end" fill="#ffffff">Day 96</text>
<text x="26" y="1921" class="body" fill="#ffffff">File an information blocking complaint. No</text>
<text x="26" y="1940" class="body" fill="#ffffff">deadline applies to a decision.</text>
<text x="26" y="1965" class="cfr" fill="#cfd6d2">42 U.S.C. 300jj-52</text>
<path d="M370,616.5 H392 V453.5 H379" fill="none" stroke="#9a5b00" stroke-width="2.2" stroke-dasharray="7 4"/>
<path d="M380,447.5 L371,453.5 L380,459.5 Z" fill="#9a5b00"/>
<text transform="translate(408,535.0) rotate(90)" text-anchor="middle" class="loop" fill="#9a5b00">3 rounds of terms</text>
<path d="M370,1612.0 H392 V1470.0 H379" fill="none" stroke="#9a5b00" stroke-width="2.2" stroke-dasharray="7 4"/>
<path d="M380,1464.0 L371,1470.0 L380,1476.0 Z" fill="#9a5b00"/>
<text transform="translate(408,1541.0) rotate(90)" text-anchor="middle" class="loop" fill="#9a5b00">terms, again</text>
<path d="M370,1442.0 H418 V644.5 H379" fill="none" stroke="#9a5b00" stroke-width="2.2" stroke-dasharray="7 4"/>
<path d="M380,638.5 L371,644.5 L380,650.5 Z" fill="#9a5b00"/>
<text transform="translate(434,1043.25) rotate(90)" text-anchor="middle" class="loop" fill="#9a5b00">same ladder, new requester</text>
<rect x="14" y="1995" width="18" height="14" rx="5" fill="#fff" stroke="#1c2321" stroke-width="2"/><text x="38" y="2006" class="leg">requester</text>
<rect x="106" y="1995" width="18" height="14" rx="1" fill="#eceeeb" stroke="#8b9490"/><text x="130" y="2006" class="leg">vendor</text>
<rect x="182" y="1995" width="26" height="14" rx="7" fill="#1c2321"/><text x="214" y="2006" class="leg">period set by rule</text>
<line x1="326" y1="2002" x2="354" y2="2002" stroke="#9a5b00" stroke-width="2.2" stroke-dasharray="7 4"/><text x="360" y="2006" class="leg">loop</text>
</svg>
