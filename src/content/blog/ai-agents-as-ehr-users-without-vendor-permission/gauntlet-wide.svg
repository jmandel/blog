<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 796 946" width="796" height="946" role="img" aria-label="Flow of a fictional request to let an agent operate an EHR: twelve steps over 96 business days, with three loops, ending in a complaint">
<style>
text{font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.title{font-size:18px;font-weight:700;fill:#1c2321}
.sub{font-size:13px;fill:#5a6662}
.who{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.day{font-size:13px;font-weight:700}
.body{font-size:14px}
.cfr{font-size:11.5px;font-family:ui-monospace,"SFMono-Regular",Menlo,monospace}
.lab{font-size:11.5px;font-weight:600}
.loop{font-size:12px;font-weight:700}
.leg{font-size:11.5px;fill:#1c2321}
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="14" y="24" class="title">96 business days to "no"</text>
<text x="14" y="44" class="sub">Fictional request. Every step is one the current rules allow.</text>
<rect x="14" y="70" width="228" height="158" rx="14" fill="#ffffff" stroke="#1c2321" stroke-width="2"/>
<text x="26" y="98" class="who" fill="#1c2321">Clinic</text>
<text x="230" y="98" class="day" text-anchor="end" fill="#1c2321">Day 0</text>
<text x="26" y="122" class="body" fill="#1c2321">The clinic asks its EHR</text>
<text x="26" y="140" class="body" fill="#1c2321">vendor to confirm clinicians</text>
<text x="26" y="158" class="body" fill="#1c2321">may use an agent.</text>
<text x="26" y="216" class="cfr" fill="#5a6662">Customer license agreement</text>
<rect x="266" y="70" width="228" height="158" rx="2" fill="#eceeeb" stroke="#8b9490" stroke-width="1.2"/>
<text x="278" y="98" class="who" fill="#1c2321">Vendor</text>
<text x="482" y="98" class="day" text-anchor="end" fill="#1c2321">Day 8</text>
<text x="278" y="122" class="body" fill="#1c2321">License §4.2 bars automated</text>
<text x="278" y="140" class="body" fill="#1c2321">use and third-party access.</text>
<text x="278" y="158" class="body" fill="#1c2321">The developer is sent to</text>
<text x="278" y="176" class="body" fill="#1c2321">Partner Programs.</text>
<text x="278" y="216" class="cfr" fill="#5a6662">Contract term; no clock</text>
<rect x="518" y="70" width="228" height="158" rx="14" fill="#ffffff" stroke="#1c2321" stroke-width="2"/>
<text x="530" y="98" class="who" fill="#1c2321">Developer</text>
<text x="734" y="98" class="day" text-anchor="end" fill="#1c2321">Day 9</text>
<text x="530" y="122" class="body" fill="#1c2321">Requests the manner it wants:</text>
<text x="530" y="140" class="body" fill="#1c2321">operate the screens, message</text>
<text x="530" y="158" class="body" fill="#1c2321">history included, under an</text>
<text x="530" y="176" class="body" fill="#1c2321">account the clinic</text>
<text x="530" y="194" class="body" fill="#1c2321">authorizes.</text>
<text x="530" y="216" class="cfr" fill="#5a6662">§171.301(a)(1)</text>
<rect x="518" y="290" width="228" height="158" rx="2" fill="#eceeeb" stroke="#8b9490" stroke-width="1.2"/>
<text x="530" y="318" class="who" fill="#1c2321">Vendor</text>
<text x="734" y="318" class="day" text-anchor="end" fill="#1c2321">Day 34</text>
<text x="530" y="342" class="body" fill="#1c2321">Names its price. The</text>
<text x="530" y="360" class="body" fill="#1c2321">cost-based, nondiscriminatory</text>
<text x="530" y="378" class="body" fill="#1c2321">fee rules skip the manner</text>
<text x="530" y="396" class="body" fill="#1c2321">requested. No agreed terms.</text>
<text x="530" y="436" class="cfr" fill="#5a6662">§171.301(a)(2)</text>
<rect x="266" y="290" width="228" height="158" rx="2" fill="#eceeeb" stroke="#8b9490" stroke-width="1.2"/>
<text x="278" y="318" class="who" fill="#1c2321">Vendor</text>
<text x="482" y="318" class="day" text-anchor="end" fill="#1c2321">Day 39</text>
<text x="278" y="342" class="body" fill="#1c2321">Offers an alternative manner</text>
<text x="278" y="360" class="body" fill="#1c2321">instead: the certified FHIR</text>
<text x="278" y="378" class="body" fill="#1c2321">API, which covers USCDI data.</text>
<text x="278" y="436" class="cfr" fill="#5a6662">§171.301(b)(1)(i)</text>
<rect x="14" y="290" width="228" height="158" rx="2" fill="#eceeeb" stroke="#8b9490" stroke-width="1.2"/>
<text x="26" y="318" class="who" fill="#1c2321">Vendor</text>
<text x="230" y="318" class="day" text-anchor="end" fill="#1c2321">Day 54</text>
<text x="26" y="342" class="body" fill="#1c2321">Registers the app on the last</text>
<text x="26" y="360" class="body" fill="#1c2321">permitted day: 10 business</text>
<text x="26" y="378" class="body" fill="#1c2321">days to verify, 5 to enable.</text>
<text x="26" y="436" class="cfr" fill="#5a6662">§170.404(b)(1)</text>
<rect x="14" y="510" width="228" height="158" rx="14" fill="#ffffff" stroke="#1c2321" stroke-width="2"/>
<text x="26" y="538" class="who" fill="#1c2321">Developer</text>
<text x="230" y="538" class="day" text-anchor="end" fill="#1c2321">Day 60</text>
<text x="26" y="562" class="body" fill="#1c2321">Message history and the</text>
<text x="26" y="580" class="body" fill="#1c2321">screening schedule are not in</text>
<text x="26" y="598" class="body" fill="#1c2321">USCDI, so not in the API.</text>
<text x="26" y="616" class="body" fill="#1c2321">Asks for them, plus drafting.</text>
<text x="26" y="656" class="cfr" fill="#5a6662">§171.102 &quot;use&quot;</text>
<rect x="266" y="510" width="228" height="158" rx="2" fill="#eceeeb" stroke="#8b9490" stroke-width="1.2"/>
<text x="278" y="538" class="who" fill="#1c2321">Vendor</text>
<text x="482" y="538" class="day" text-anchor="end" fill="#1c2321">Day 70</text>
<text x="278" y="562" class="body" fill="#1c2321">Drafts denied in writing: a</text>
<text x="278" y="580" class="body" fill="#1c2321">third party seeking to modify</text>
<text x="278" y="598" class="body" fill="#1c2321">EHI. Messages offered as a</text>
<text x="278" y="616" class="body" fill="#1c2321">nightly file.</text>
<text x="278" y="656" class="cfr" fill="#5a6662">§171.204(a)(3); §171.301(b)</text>
<rect x="518" y="510" width="228" height="158" rx="14" fill="#ffffff" stroke="#1c2321" stroke-width="2"/>
<text x="530" y="538" class="who" fill="#1c2321">Clinic</text>
<text x="734" y="538" class="day" text-anchor="end" fill="#1c2321">Day 71</text>
<text x="530" y="562" class="body" fill="#1c2321">Makes the same request</text>
<text x="530" y="580" class="body" fill="#1c2321">itself, as the vendor&#x27;s</text>
<text x="530" y="598" class="body" fill="#1c2321">customer.</text>
<text x="530" y="656" class="cfr" fill="#5a6662">§171.301(a)(1)</text>
<rect x="518" y="730" width="228" height="158" rx="2" fill="#eceeeb" stroke="#8b9490" stroke-width="1.2"/>
<text x="530" y="758" class="who" fill="#1c2321">Vendor</text>
<text x="734" y="758" class="day" text-anchor="end" fill="#1c2321">Day 85</text>
<text x="530" y="782" class="body" fill="#1c2321">Quotes an add-on. No</text>
<text x="530" y="800" class="body" fill="#1c2321">agreeable terms. Two</text>
<text x="530" y="818" class="body" fill="#1c2321">alternatives are already on</text>
<text x="530" y="836" class="body" fill="#1c2321">the table.</text>
<text x="530" y="876" class="cfr" fill="#5a6662">§171.301(a), (b)</text>
<rect x="266" y="730" width="228" height="158" rx="2" fill="#eceeeb" stroke="#8b9490" stroke-width="1.2"/>
<text x="278" y="758" class="who" fill="#1c2321">Vendor</text>
<text x="482" y="758" class="day" text-anchor="end" fill="#1c2321">Day 95</text>
<text x="278" y="782" class="body" fill="#1c2321">Letter: infeasible, manner</text>
<text x="278" y="800" class="body" fill="#1c2321">exception exhausted.</text>
<text x="278" y="876" class="cfr" fill="#5a6662">§171.204(a)(4), (b)</text>
<rect x="14" y="730" width="228" height="158" rx="14" fill="#1c2321" stroke="#1c2321" stroke-width="2"/>
<text x="26" y="758" class="who" fill="#fff">Clinic + developer</text>
<text x="230" y="758" class="day" text-anchor="end" fill="#fff">Day 96</text>
<text x="26" y="782" class="body" fill="#fff">File an information blocking</text>
<text x="26" y="800" class="body" fill="#fff">complaint. No deadline</text>
<text x="26" y="818" class="body" fill="#fff">applies to a decision.</text>
<text x="26" y="876" class="cfr" fill="#cfd6d2">42 U.S.C. 300jj-52</text>
<line x1="242" y1="149.0" x2="266" y2="149.0" stroke="#1c2321" stroke-width="1.6"/>
<path d="M258,144.0 L266,149.0 L258,154.0 Z" fill="#1c2321"/>
<line x1="494" y1="149.0" x2="518" y2="149.0" stroke="#1c2321" stroke-width="1.6"/>
<path d="M510,144.0 L518,149.0 L510,154.0 Z" fill="#1c2321"/>
<line x1="632.0" y1="228" x2="632.0" y2="290" stroke="#1c2321" stroke-width="1.6"/>
<path d="M627.0,282 L632.0,290 L637.0,282 Z" fill="#1c2321"/>
<line x1="518" y1="369.0" x2="494" y2="369.0" stroke="#1c2321" stroke-width="1.6"/>
<path d="M502,364.0 L494,369.0 L502,374.0 Z" fill="#1c2321"/>
<line x1="266" y1="369.0" x2="242" y2="369.0" stroke="#1c2321" stroke-width="1.6"/>
<path d="M250,364.0 L242,369.0 L250,374.0 Z" fill="#1c2321"/>
<line x1="128.0" y1="448" x2="128.0" y2="510" stroke="#1c2321" stroke-width="1.6"/>
<path d="M123.0,502 L128.0,510 L133.0,502 Z" fill="#1c2321"/>
<line x1="242" y1="589.0" x2="266" y2="589.0" stroke="#1c2321" stroke-width="1.6"/>
<path d="M258,584.0 L266,589.0 L258,594.0 Z" fill="#1c2321"/>
<line x1="494" y1="589.0" x2="518" y2="589.0" stroke="#1c2321" stroke-width="1.6"/>
<path d="M510,584.0 L518,589.0 L510,594.0 Z" fill="#1c2321"/>
<line x1="632.0" y1="668" x2="632.0" y2="730" stroke="#1c2321" stroke-width="1.6"/>
<path d="M627.0,722 L632.0,730 L637.0,722 Z" fill="#1c2321"/>
<line x1="518" y1="809.0" x2="494" y2="809.0" stroke="#1c2321" stroke-width="1.6"/>
<path d="M502,804.0 L494,809.0 L502,814.0 Z" fill="#1c2321"/>
<line x1="266" y1="809.0" x2="242" y2="809.0" stroke="#1c2321" stroke-width="1.6"/>
<path d="M250,804.0 L242,809.0 L250,814.0 Z" fill="#1c2321"/>
<path d="M746,349.0 H770 V159.0 H756" fill="none" stroke="#9a5b00" stroke-width="2.2" stroke-dasharray="7 4"/>
<path d="M757,153.0 L747,159.0 L757,165.0 Z" fill="#9a5b00"/>
<text transform="translate(780,254.0) rotate(90)" text-anchor="middle" class="loop" fill="#9a5b00">3 rounds of terms</text>
<path d="M746,569.0 H770 V389.0 H756" fill="none" stroke="#9a5b00" stroke-width="2.2" stroke-dasharray="7 4"/>
<path d="M757,383.0 L747,389.0 L757,395.0 Z" fill="#9a5b00"/>
<text transform="translate(780,479.0) rotate(90)" text-anchor="middle" class="loop" fill="#9a5b00">same ladder, new requester</text>
<path d="M746,789.0 H770 V609.0 H756" fill="none" stroke="#9a5b00" stroke-width="2.2" stroke-dasharray="7 4"/>
<path d="M757,603.0 L747,609.0 L757,615.0 Z" fill="#9a5b00"/>
<text transform="translate(780,699.0) rotate(90)" text-anchor="middle" class="loop" fill="#9a5b00">terms, again</text>
<rect x="276" y="58" width="174.0" height="24" rx="12" fill="#fff" stroke="#5a6662" stroke-dasharray="4 3"/>
<text x="285" y="74.5" class="lab" fill="#1c2321">8 business days · no clock</text>
<rect x="528" y="58" width="48.0" height="24" rx="12" fill="#fff" stroke="#5a6662" stroke-dasharray="4 3"/>
<text x="537" y="74.5" class="lab" fill="#1c2321">1 day</text>
<rect x="569.0" y="243.0" width="126.0" height="24" rx="12" fill="#fff" stroke="#5a6662" stroke-dasharray="4 3"/>
<text x="578.0" y="259.5" class="lab" fill="#1c2321">25 days · no clock</text>
<rect x="364.0" y="278" width="120.0" height="24" rx="12" fill="#fff" stroke="#5a6662" stroke-dasharray="4 3"/>
<text x="373.0" y="294.5" class="lab" fill="#1c2321">5 days · no clock</text>
<rect x="118.0" y="278" width="114.0" height="24" rx="12" fill="#1c2321"/>
<text x="127.0" y="294.5" class="lab" fill="#fff">15 business days</text>
<rect x="68.0" y="463.0" width="120.0" height="24" rx="12" fill="#fff" stroke="#5a6662" stroke-dasharray="4 3"/>
<text x="77.0" y="479.5" class="lab" fill="#1c2321">6 days of testing</text>
<rect x="276" y="498" width="114.0" height="24" rx="12" fill="#1c2321"/>
<text x="285" y="514.5" class="lab" fill="#fff">10 business days</text>
<rect x="528" y="498" width="48.0" height="24" rx="12" fill="#fff" stroke="#5a6662" stroke-dasharray="4 3"/>
<text x="537" y="514.5" class="lab" fill="#1c2321">1 day</text>
<rect x="569.0" y="683.0" width="126.0" height="24" rx="12" fill="#fff" stroke="#5a6662" stroke-dasharray="4 3"/>
<text x="578.0" y="699.5" class="lab" fill="#1c2321">14 days · no clock</text>
<rect x="370.0" y="718" width="114.0" height="24" rx="12" fill="#1c2321"/>
<text x="379.0" y="734.5" class="lab" fill="#fff">10 business days</text>
<rect x="184.0" y="718" width="48.0" height="24" rx="12" fill="#fff" stroke="#5a6662" stroke-dasharray="4 3"/>
<text x="193.0" y="734.5" class="lab" fill="#1c2321">1 day</text>
<rect x="14" y="920" width="18" height="14" rx="5" fill="#fff" stroke="#1c2321" stroke-width="2"/><text x="38" y="931" class="leg">requester</text>
<rect x="106" y="920" width="18" height="14" rx="1" fill="#eceeeb" stroke="#8b9490"/><text x="130" y="931" class="leg">vendor</text>
<rect x="182" y="920" width="26" height="14" rx="7" fill="#1c2321"/><text x="214" y="931" class="leg">period set by rule</text>
<line x1="326" y1="927" x2="354" y2="927" stroke="#9a5b00" stroke-width="2.2" stroke-dasharray="7 4"/><text x="360" y="931" class="leg">loop</text>
</svg>
